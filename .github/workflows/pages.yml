name: Publish CRM deployment status
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp docs/images/dashboard-server.png ops/pages/dashboard-server.png
      - run: touch ops/pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ops/pages
  deploy:
    needs: status
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish deployment status
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment status
        run: python3 scripts/verify_public_site.py
